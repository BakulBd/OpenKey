name: Bug report
description: Something in OpenKey does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard
      description: Model and USB ID if known (e.g. AJAZZ AK820 MAX, 0C45:8009).
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Ubuntu 26.04
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic package
      description: Device Lab → Export diagnostic package, then attach the file. It contains descriptors only, no typing or settings.
