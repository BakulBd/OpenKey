name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Real hardware is never required: the smoke test runs the demo (firmware simulator) in the
      # runner's preinstalled Chrome, with the production security headers from vercel.json.
      - name: Browser smoke test
        run: node tools/e2e/smoke.mjs
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
