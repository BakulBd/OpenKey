# OpenKey static site for nginx (used by the Dockerfile; also works on a plain nginx host).
# Headers match vercel.json: every location includes the security snippet, because an add_header in
# a location replaces the ones inherited from the server block.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hash routing: only "/" needs index.html; every other path is a real file.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # The service worker must be revalidated on every load, or updates never reach users.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Linux udev rule and installer: plain text, offered as downloads.
    location /linux/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }
    location = /_headers {
        return 404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}
